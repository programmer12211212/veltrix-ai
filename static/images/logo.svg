<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c026d3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer large triangle (pointing up) -->
  <polygon points="50,6 94,82 6,82"
    fill="none" stroke="url(#gOuter)" stroke-width="2.5"
    stroke-linejoin="round" filter="url(#glow)" opacity="0.9"/>

  <!-- Inner inverted triangle (pointing down) -->
  <polygon points="50,94 14,28 86,28"
    fill="none" stroke="url(#gOuter)" stroke-width="2.5"
    stroke-linejoin="round" filter="url(#glow)" opacity="0.9"/>

  <!-- V shape inner -->
  <polyline points="30,18 50,60 70,18"
    fill="none" stroke="url(#gInner)" stroke-width="2"
    stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Horizontal connector lines -->
  <line x1="16" y1="50" x2="35" y2="50" stroke="url(#gInner)" stroke-width="1.5" opacity="0.8"/>
  <line x1="65" y1="50" x2="84" y2="50" stroke="url(#gInner)" stroke-width="1.5" opacity="0.8"/>

  <!-- Diagonal connectors left -->
  <line x1="6" y1="82" x2="20" y2="60" stroke="#7c3aed" stroke-width="1.2" opacity="0.7"/>
  <!-- Diagonal connectors right -->
  <line x1="94" y1="82" x2="80" y2="60" stroke="#7c3aed" stroke-width="1.2" opacity="0.7"/>
  <!-- Top connectors -->
  <line x1="50" y1="6" x2="36" y2="28" stroke="#06b6d4" stroke-width="1.2" opacity="0.7"/>
  <line x1="50" y1="6" x2="64" y2="28" stroke="#06b6d4" stroke-width="1.2" opacity="0.7"/>

  <!-- Center node -->
  <circle cx="50" cy="50" r="5" fill="url(#gInner)" filter="url(#strongGlow)"/>
  <circle cx="50" cy="50" r="2.5" fill="white" opacity="0.9"/>

  <!-- Outer corner nodes -->
  <circle cx="50" cy="6" r="3" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="6" cy="82" r="3" fill="#7c3aed" filter="url(#glow)"/>
  <circle cx="94" cy="82" r="3" fill="#7c3aed" filter="url(#glow)"/>

  <!-- Mid nodes -->
  <circle cx="16" cy="50" r="2.5" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="84" cy="50" r="2.5" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="30" cy="18" r="2.5" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="70" cy="18" r="2.5" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="50" cy="60" r="2.5" fill="url(#gInner)" filter="url(#glow)"/>
</svg>
